<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <div id="app">

    <aside id="sidebar">
      <p id="sidebar-label">My projects</p>
      <div id="project-list"></div>
      <button id="new-project-btn">+ New project</button>
    </aside>

    <main id="content">
      <div id="main-header">
        <div>
          <h2 id="project-title"></h2>
          <p id="project-subtitle"></p>
        </div>
        <button id="add-todo-btn">+ Add todo</button>
      </div>

      <div id="priority-legend">
        <span>Priority color:</span>
        <span class="legend-high">High</span>
        <span class="legend-medium">Medium</span>
        <span class="legend-low">Low</span>
      </div>

      <div id="todo-list"></div>
    </main>

  </div>

  <dialog id="project-dialog">
  <form>
    <h2>New Project</h2>
    <label for="project-name">Title</label>
    <input type="text" id="project-name">
    <div>
      <button type="button" id="cancel-project-btn">Cancel</button>
      <button type="button" id="confirm-project-btn">Add</button>
    </div>
  </form>
</dialog>

<dialog id="todo-dialog">
  <form>
    <h2>New Todo</h2>
    <label for="todo-title">Title</label>
    <input type="text" id="todo-title">
    
    <label for="todo-desc">Description</label>
    <input type="text" id="todo-desc">

    <label for="todo-date">Due date</label>
    <input type="date" id="todo-date">

    <label for="todo-priority">Priority</label>
    <select id="todo-priority">

      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>

    </select>

    <label for="todo-notes">Notes</label>
    <input type="text" id="todo-notes">

    <div>
      <button type="button" id="cancel-todo-btn">Cancel</button>
      <button type="button" id="confirm-todo-btn">Add</button>
    </div>
  </form>
</dialog>


</body>
</html>
